[General]

; Set to 0 to turn the mod off and leave the game as it was.
Enabled = 1

; The instant bust itself. At 0 a reset puts you back under the normal rules,
; so outrunning the cops still works. At 1 you get the stock behaviour, where
; the bust lands no matter what you do.
ResetAutoBust = 0

; How fast the busted meter climbs after a reset. 1.0 is the same as any other
; bust, 4.0 is what the game uses. Raise it if you want a reset to cost you
; something without being a guaranteed bust.
ResetBustMultiplier = 1.0
